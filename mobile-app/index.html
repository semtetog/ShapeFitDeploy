<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appshapefit.com https://*.appshapefit.com data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com data:;">
    
    <title>ShapeFit</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #101010;
            color: #F5F5F5;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-container {
            text-align: center;
        }
        .spinner {
            border: 3px solid rgba(255, 107, 0, 0.1);
            border-top: 3px solid #FF6B00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Carregando ShapeFit...</p>
    </div>

    <script>
        // Fallback inline
        window.Capacitor = window.Capacitor || { isNative: false };
        
        // Registrar Service Worker em background (não bloquear)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then(() => console.log('✅ Service Worker registrado'))
                .catch(() => console.warn('⚠️ Service Worker não registrado'));
        }
        
        // Redirecionar IMEDIATAMENTE - sem delays
        // O index.php já tem toda a lógica de verificar login e redirecionar
        window.location.replace('./index.php');
    </script>
</body>
</html>
