<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShapeFit - Offline</title>
    <script src="capacitor.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #101010;
            color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .offline-popup-overlay {
            width: 100%;
            max-width: 380px;
        }
        .offline-popup-content {
            background: linear-gradient(165deg, rgba(60, 60, 60, 0.3) 0%, rgba(45, 45, 45, 0.2) 100%);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .offline-popup-icon {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-popup-signal {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
        }
        .offline-popup-signal .bar {
            width: 5px;
            background: #F44336;
            border-radius: 3px 3px 0 0;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .offline-popup-signal .bar-1 { height: 10px; animation-delay: 0s; }
        .offline-popup-signal .bar-2 { height: 16px; animation-delay: 0.2s; }
        .offline-popup-signal .bar-3 { height: 22px; animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .offline-popup-title {
            font-size: 22px;
            font-weight: 700;
            color: #F5F5F5;
            margin-bottom: 12px;
        }
        .offline-popup-message {
            font-size: 15px;
            color: #A3A3A3;
            margin-bottom: 10px;
            line-height: 1.55;
        }
        .offline-popup-submessage {
            font-size: 13px;
            color: #A3A3A3;
            opacity: 0.8;
            margin-bottom: 22px;
            line-height: 1.55;
        }
        .offline-popup-checking {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #A3A3A3;
            font-size: 14px;
        }
        .offline-popup-checking.active {
            display: flex;
        }
        .offline-popup-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FF6B00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .offline-popup-button {
            background: linear-gradient(45deg, #FFAE00, #F83600);
            background-size: 150% auto;
            color: #F5F5F5 !important;
            border: none;
            border-radius: 16px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, background-position 0.4s ease;
            -webkit-tap-highlight-color: transparent; /* Remove o highlight azul no Android */
        }
        .offline-popup-button:hover {
            background-position: right center;
        }
        .offline-popup-button:active {
            transform: scale(0.98);
        }
        .offline-popup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* Animação de rotação para o spinner do botão */
        .offline-popup-button.checking .button-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-top-color: #F5F5F5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .offline-popup-button.checking .button-text {
            display: none;
        }
        .button-spinner {
            display: none;
        }
        /* Remover a animação de rotação */
        .offline-popup-button.rotating span:first-child {
            display: none; /* Esconde o ícone de sync */
        }
        .offline-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .offline-link {
            color: #FF6B00;
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 107, 0, 0.1);
            transition: background 0.3s ease;
        }
        .offline-link:hover {
            background: rgba(255, 107, 0, 0.2);
        }
    </style>
    <script>
        (function() {
            let checkInterval = null;
            
            async function verifyConnection() {
                try {
                    const timestamp = new Date().getTime();
                    const controller = new AbortController();
                    // Timeout aumentado para 5 segundos para mais robustez em redes lentas
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    // Usar um arquivo de 'ping' estático é muito mais rápido e confiável
                    // do que carregar uma página PHP inteira para verificar a conexão.
                    const response = await fetch(`/ping.txt?t=${timestamp}`, {
                        method: 'GET',
                        signal: controller.signal,
                        cache: 'no-store'
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        console.log('✅ Conexão com o servidor verificada.');
                        return true;
                    }
                    
                    console.warn('⚠️ Verificação de conexão falhou, status:', response.status);
                    return false;

                } catch (error) {
                    console.warn('⚠️ Falha ao verificar conexão com o servidor:', error.name);
                    return false;
                }
            }
            
            async function retryConnection() {
                const retryBtn = document.getElementById('offline-popup-retry');
                const checkingText = document.getElementById('offline-popup-checking');
                
                if (retryBtn) {
                    retryBtn.disabled = true;
                    retryBtn.classList.add('checking');
                }
                if (checkingText) {
                    checkingText.style.display = 'flex';
                }
                
                const canReach = await verifyConnection();
                
                if (checkingText) {
                    checkingText.style.display = 'none';
                }
                
                if (canReach) {
                    // Redireciona para a página principal ao invés de apenas recarregar.
                    // Isso garante que o usuário saia da tela offline.
                    window.location.href = '/main_app.php';
                } else {
                    if (retryBtn) {
                        retryBtn.disabled = false;
                        retryBtn.classList.remove('checking');
                    }
                }
            }
            
            // Verificação automática a cada 5 segundos
            function startAutoCheck() {
                if (!checkInterval) {
                    checkInterval = setInterval(async () => {
                        const canReach = await verifyConnection();
                        if (canReach) {
                            window.location.reload();
                        }
                    }, 5000);
                }
            }
            
            // Inicializar
            document.addEventListener('DOMContentLoaded', () => {
                const retryBtn = document.getElementById('offline-popup-retry');
                if (retryBtn) {
                    retryBtn.addEventListener('click', retryConnection);
                }
                startAutoCheck();
            });
            
            // Listener para quando voltar online
            window.addEventListener('online', () => {
                window.location.reload();
            });
        })();
    </script>
</head>
<body>
    <div class="offline-popup-overlay">
        <div class="offline-popup-content">
            <div class="offline-popup-icon">
                <div class="offline-popup-signal">
                    <div class="bar bar-1"></div>
                    <div class="bar bar-2"></div>
                    <div class="bar bar-3"></div>
                </div>
            </div>
            <h2 class="offline-popup-title">Sem Conexão</h2>
            <p class="offline-popup-message">
                Parece que você está sem internet no momento.
            </p>
            <p class="offline-popup-submessage">
                Verifique sua conexão e tente novamente.
            </p>
            <div class="offline-popup-checking" id="offline-popup-checking">
                <div class="offline-popup-spinner"></div>
                <span>Verificando conexão...</span>
            </div>
            <button class="offline-popup-button" id="offline-popup-retry">
                <span class="button-spinner"></span>
                <span class="button-text">Tentar Novamente</span>
            </button>
            <!-- Links removidos -->
        </div>
    </div>
</body>
</html>
